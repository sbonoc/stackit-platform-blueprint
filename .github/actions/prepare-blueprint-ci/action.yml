name: Prepare Blueprint CI
description: Setup shared tooling and bootstrap the blueprint baseline for CI jobs.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        # Pin to the version declared in docs/package.json#packageManager so that
        # Corepack does not resolve to a newer default (pnpm@11+ enforces strict
        # version matching and won't auto-downgrade when invoked via Corepack).
        corepack prepare pnpm@10.32.1 --activate
        pnpm --version

    # Setup uv binary before prereqs so that install_pre_commit() in prereqs.sh
    # can use `uv tool install` instead of `pip install --user`.  The uv sync
    # step (and PATH addition of .venv/bin) is intentionally deferred until
    # AFTER prereqs: pip --user installs fail when python3 resolves to a venv
    # interpreter, which would break the pre-commit auto-install.
    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Ensure CI CLI prerequisites
      shell: bash
      run: |
        PREREQS_AUTO_INSTALL=true \
        PREREQS_INSTALL_OPTIONAL=false \
        PREREQS_REQUIRE_STACKIT_TOOLS=false \
        make infra-prereqs
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # uv sync runs after prereqs so that the venv is not yet active during the
    # prereqs step above (pip --user installs fail inside a venv). All make
    # targets now invoke python via `uv run python3`, so .venv/bin does not
    # need to be on PATH — uv run resolves the project environment automatically.
    - name: Install Python dependencies
      shell: bash
      run: |
        uv sync --frozen

    - name: Bootstrap blueprint and infra baseline
      shell: bash
      run: |
        make blueprint-bootstrap
        make infra-bootstrap

    - name: Bootstrap project dependencies for clean runners
      shell: bash
      run: |
        BLUEPRINT_PROFILE=local-lite OBSERVABILITY_ENABLED=false make apps-ci-bootstrap
