name: Prepare Blueprint CI
description: Setup shared tooling and bootstrap the blueprint baseline for CI jobs.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        # Pin to the version declared in docs/package.json#packageManager.
        # Keep this in sync with docs/package.json#packageManager — the
        # test_docs_pnpm_version_sources_aligned test enforces the invariant
        # so a future bump here without updating docs/package.json (or vice
        # versa) will fail CI before the version mismatch can cause a runtime
        # install failure.
        corepack prepare pnpm@11.9.0 --activate
        pnpm --version

    # Setup uv binary before prereqs so that install_pre_commit() in prereqs.sh
    # can use `uv tool install` instead of `pip install --user`.  The uv sync
    # step (and PATH addition of .venv/bin) is intentionally deferred until
    # AFTER prereqs: pip --user installs fail when python3 resolves to a venv
    # interpreter, which would break the pre-commit auto-install.
    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Ensure CI CLI prerequisites
      shell: bash
      run: |
        PREREQS_AUTO_INSTALL=true \
        PREREQS_INSTALL_OPTIONAL=false \
        PREREQS_REQUIRE_STACKIT_TOOLS=false \
        make infra-prereqs
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # uv sync runs after prereqs so that the venv is not yet active during the
    # prereqs step above (pip --user installs fail inside a venv).
    #
    # .venv/bin is added to GITHUB_PATH so that `python3` resolves to the venv
    # interpreter in ALL subsequent steps — including shell scripts that invoke
    # Python directly via their shebang (e.g. init_repo.sh → init_repo.py,
    # validate.sh → validate_contract.py).  `uv run python3` picks up the venv
    # automatically, but direct-shebang invocations rely on PATH.  Without this,
    # system python3 is used and pyyaml (installed only in .venv) is not found.
    - name: Install Python dependencies
      shell: bash
      run: |
        uv sync --frozen
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Bootstrap blueprint and infra baseline
      shell: bash
      run: |
        make blueprint-bootstrap
        make infra-bootstrap

    - name: Bootstrap project dependencies for clean runners
      shell: bash
      run: |
        BLUEPRINT_PROFILE=local-lite OBSERVABILITY_ENABLED=false make apps-ci-bootstrap
