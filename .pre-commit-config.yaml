repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: bash-syntax
        name: bash syntax check
        language: system
        entry: bash -n
        files: \.sh$
        # Intentional-error fixtures live here and must not be syntax-checked.
        exclude: ^tests/blueprint/fixtures/shell_behavioral_check/
      - id: quality-docs-lint
        name: quality docs lint (markdown targets and links)
        language: system
        entry: make quality-docs-lint
        pass_filenames: false
        always_run: true
      - id: quality-test-pyramid
        name: quality test-pyramid classification check
        language: system
        entry: uv run python3 scripts/bin/quality/check_test_pyramid.py
        pass_filenames: false
        # Trigger whenever a test file is staged so unclassified test_*.py files
        # are caught at commit time rather than only at pre-push or in CI.
        files: ^tests/.*\.py$
        always_run: false
      - id: quality-validate-bootstrap-template-drift
        name: quality bootstrap template drift check
        language: system
        entry: make quality-validate-bootstrap-template-drift
        pass_filenames: false
        files: ^(\.dockerignore|\.gitignore|\.editorconfig|\.pre-commit-config\.yaml|Makefile|scripts/templates/blueprint/bootstrap/)
      - id: quality-validate-contract-required-files
        name: quality contract required-files existence check (pre-push)
        language: system
        entry: make quality-validate-contract-required-files
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: quality-validate-branch
        name: quality validate branch naming (pre-push)
        language: system
        entry: uv run python3 scripts/bin/blueprint/validate_contract.py --branch-only
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: quality-docs-check-changed-pre-push
        name: quality docs check changed scope (pre-push)
        language: system
        entry: make quality-docs-check-changed
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: infra-audit-version-cached
        name: infra audit version cached (pre-push)
        language: system
        entry: make infra-audit-version-cached
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: apps-audit-versions-cached
        name: apps audit versions cached (pre-push)
        language: system
        entry: make apps-audit-versions-cached
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: pnpm-lockfile-sync
        name: pnpm lockfile sync (pre-push)
        language: system
        # Guard: skip silently in repos that have no root package.json (e.g. the blueprint source
        # repo itself, which has docs/package.json but no pnpm workspace at root).
        entry: bash -c 'if [ -f package.json ]; then pnpm install --frozen-lockfile --prefer-offline; fi'
        pass_filenames: false
        stages: [pre-push]
        files: (^|/)package\.json$
      - id: quality-c7-jsonl-validate
        name: quality C7 JSONL schema validation
        language: system
        entry: uv run python3 scripts/bin/quality/validate_c7_jsonl.py
        files: ^artifacts/c7/.*\.jsonl$
        always_run: false
      - id: blueprint-test-unit
        name: blueprint unit test suite (pre-push)
        language: system
        # always_run: blueprint tests cover cross-cutting contracts; any file change can break them.
        # The target no-ops in generated-consumer repos where tests/blueprint is source-only.
        entry: make blueprint-test-unit
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: touchpoints-test-unit-pre-push
        name: touchpoints unit tests (pre-push)
        language: system
        entry: make touchpoints-test-unit
        pass_filenames: false
        stages: [pre-push]
        files: ^apps/touchpoints/.*\.(ts|vue|tsx)$
        always_run: false
      - id: touchpoints-test-contracts-pre-push
        name: touchpoints contract tests (pre-push)
        language: system
        entry: make touchpoints-test-contracts
        pass_filenames: false
        stages: [pre-push]
        files: ^(apps/touchpoints/.*\.(ts|vue|tsx)|apps/packages/api-client/src/.*\.ts|tests/touchpoints/contracts/.*\.py)$
        always_run: false
      - id: backend-test-unit-pre-push
        name: backend unit tests (pre-push)
        language: system
        entry: make backend-test-unit
        pass_filenames: false
        stages: [pre-push]
        files: ^(apps/backend/|tests/backend/).*\.py$
        always_run: false
      - id: backend-test-contracts-pre-push
        name: backend contract tests (pre-push)
        language: system
        entry: make backend-test-contracts
        pass_filenames: false
        stages: [pre-push]
        files: ^(apps/backend/|tests/backend/).*\.py$
        always_run: false
      - id: touchpoints-test-integration-pre-push
        name: touchpoints integration tests (pre-push)
        language: system
        entry: make touchpoints-test-integration
        pass_filenames: false
        stages: [pre-push]
        files: ^(apps/touchpoints/.*\.(ts|vue|tsx)|apps/packages/api-client/src/.*\.ts)$
        always_run: false
      - id: quality-consumer-pre-push
        name: consumer pre-push quality gate
        language: system
        entry: make quality-consumer-pre-push
        pass_filenames: false
        stages: [pre-push]
        always_run: true
