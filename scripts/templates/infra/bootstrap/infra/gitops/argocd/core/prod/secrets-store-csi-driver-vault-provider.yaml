apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-store-csi-driver-vault-provider-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: platform-blueprint
    app.kubernetes.io/component: core-runtime
    app.kubernetes.io/name: secrets-store-csi-driver-vault-provider
    app.kubernetes.io/environment: prod
spec:
  project: platform-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault-csi-provider
    targetRevision: 0.5.0
    helm:
      releaseName: vault-csi-provider
      values: |
        # Set to STACKIT SM vault address: https://secrets.<region>.onstackit.cloud/<sm-instance-name>
        # Obtain instance name from `make infra-stackit-foundation-apply` output (secrets_manager_vault_address).
        vaultAddress: "https://secrets.eu01.onstackit.cloud/CHANGE_ME_SM_INSTANCE_NAME_PROD"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
