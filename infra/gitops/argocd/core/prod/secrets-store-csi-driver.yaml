apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-store-csi-driver-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: platform-blueprint
    app.kubernetes.io/component: core-runtime
    app.kubernetes.io/name: secrets-store-csi-driver
    app.kubernetes.io/environment: prod
spec:
  project: platform-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
    chart: secrets-store-csi-driver
    targetRevision: 1.4.6
    helm:
      releaseName: secrets-store-csi-driver
      values: |
        syncSecret:
          enabled: false
        enableSecretRotation: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
