apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-observability-deployment
  namespace: argocd
data:
  module: "observability"
  environment: "dev"
  deploymentDriver: "argocd"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-blueprint
    app.kubernetes.io/component: optional-module
    app.kubernetes.io/name: observability
    app.kubernetes.io/environment: dev
spec:
  project: platform-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.147.1
    helm:
      releaseName: blueprint-otel-collector
      values: |
        mode: deployment
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            faro:
              endpoint: 0.0.0.0:12347
              cors:
                allowed_origins:
                  - "${env:FARO_CORS_ALLOWED_ORIGINS}"
          processors:
            memory_limiter:
              check_interval: 1s
              limit_percentage: 80
              spike_limit_percentage: 25
            filter/drop-healthcheck-spans:
              error_mode: ignore
              traces:
                span:
                  - attributes["http.route"] == "/healthz"
                  - attributes["http.target"] == "/healthz"
            batch: {}
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
            basicauth/stackit:
              client_auth:
                username: ${file:/etc/otel/secrets/username}
                password: ${file:/etc/otel/secrets/password}
          exporters:
            prometheusremotewrite:
              endpoint: ${file:/etc/otel/secrets/METRICS_PUSH_URL}
              auth:
                authenticator: basicauth/stackit
              tls:
                insecure: false
            loki:
              endpoint: ${file:/etc/otel/secrets/LOGS_PUSH_URL}
              auth:
                authenticator: basicauth/stackit
              tls:
                insecure: false
            otlp/stackit:
              endpoint: ${file:/etc/otel/secrets/TRACES_PUSH_URL}
              auth:
                authenticator: basicauth/stackit
              tls:
                insecure: false
          connectors:
            spanmetrics:
              histogram:
                explicit:
                  buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms]
              dimensions:
                - name: http.method
                  default: GET
                - name: http.status_code
          service:
            extensions:
              - health_check
              - basicauth/stackit
            pipelines:
              traces:
                receivers: [otlp, faro]
                processors: [memory_limiter, filter/drop-healthcheck-spans, batch]
                exporters: [otlp/stackit, spanmetrics]
              metrics:
                receivers: [otlp, spanmetrics]
                processors: [memory_limiter, batch]
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp, faro]
                processors: [memory_limiter, batch]
                exporters: [loki]
        extraVolumes:
          - name: obs-auth
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: blueprint-observability-csi
        extraVolumeMounts:
          - name: obs-auth
            mountPath: /etc/otel/secrets
            readOnly: true
        extraEnvs:
          - name: FARO_CORS_ALLOWED_ORIGINS
            value: "*"
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          faro:
            enabled: true
            containerPort: 12347
            servicePort: 12347
            protocol: TCP
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: blueprint-observability-csi
  namespace: observability
spec:
  provider: vault
  parameters:
    # Vault address: https://secrets.<region>.onstackit.cloud/<sm-instance-name>
    # Read secrets_manager_vault_address from foundation TF outputs after first apply.
    vaultAddress: "https://secrets.eu01.onstackit.cloud/CHANGE_ME_SM_INSTANCE_NAME_DEV"
    # Vault auth: set roleName + vaultKubernetesMountPath for Kubernetes JWT auth (recommended),
    # or create K8s Secret 'vault-sm-auth' in namespace 'observability' with key 'token' = SM user
    # password and add nodePublishSecretRef: {name: vault-sm-auth, key: token} for token auth.
    # See docs/platform/prerequisites.md for setup instructions.
    roleName: "CHANGE_ME_VAULT_ROLE_NAME"
    vaultKubernetesMountPath: "kubernetes"
    objects: |
      - objectName: "username"
        secretPath: "secret/data/observability/otel-credentials"
        secretKey: "username"
      - objectName: "password"
        secretPath: "secret/data/observability/otel-credentials"
        secretKey: "password"
      - objectName: "METRICS_PUSH_URL"
        secretPath: "secret/data/observability/otel-credentials"
        secretKey: "METRICS_PUSH_URL"
      - objectName: "LOGS_PUSH_URL"
        secretPath: "secret/data/observability/otel-credentials"
        secretKey: "LOGS_PUSH_URL"
      - objectName: "TRACES_PUSH_URL"
        secretPath: "secret/data/observability/otel-credentials"
        secretKey: "TRACES_PUSH_URL"
