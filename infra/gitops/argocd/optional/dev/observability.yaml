apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-observability-deployment
  namespace: argocd
data:
  module: "observability"
  environment: "dev"
  deploymentDriver: "argocd"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-blueprint
    app.kubernetes.io/component: optional-module
    app.kubernetes.io/name: observability
    app.kubernetes.io/environment: dev
spec:
  project: platform-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.147.1
    helm:
      releaseName: blueprint-otel-collector
      values: |
        mode: deployment
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch: {}
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
            basicauth/stackit:
              client_auth:
                username: ${env:username}
                password: ${env:password}
          exporters:
            prometheusremotewrite:
              endpoint: ${env:METRICS_PUSH_URL}
              auth:
                authenticator: basicauth/stackit
              tls:
                insecure: false
            loki:
              endpoint: ${env:LOGS_PUSH_URL}
              auth:
                authenticator: basicauth/stackit
              tls:
                insecure: false
            otlp/stackit:
              endpoint: ${env:TRACES_PUSH_URL}
              auth:
                authenticator: basicauth/stackit
              tls:
                insecure: false
          service:
            extensions:
              - health_check
              - basicauth/stackit
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlp/stackit]
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [loki]
        extraEnvFrom:
          - secretRef:
              name: blueprint-observability-auth
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
