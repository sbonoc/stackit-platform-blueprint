executor: "LocalExecutor"

images:
  airflow:
    pullPolicy: IfNotPresent

dags:
  gitSync:
    enabled: true
    repo: ""
    branch: "main"
    subPath: "/dags"
    credentialsSecret: "airflow-git-credentials"
    period: "60s"
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

webserver:
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  webserverConfig: |
    import os
    from airflow.www.security import AirflowSecurityManager
    from flask_appbuilder.security.manager import AUTH_OAUTH

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Viewer"
    OAUTH_PROVIDERS = [
      {
        "name": "keycloak",
        "token_key": "access_token",
        "icon": "fa-key",
        "remote_app": {
          "client_id": os.environ.get("WORKFLOWS_LOCAL_OIDC_CLIENT_ID", ""),
          "client_secret": os.environ.get("WORKFLOWS_LOCAL_OIDC_CLIENT_SECRET", ""),
          "server_metadata_url": os.environ.get("WORKFLOWS_LOCAL_OIDC_ISSUER_URL", "") + "/.well-known/openid-configuration",
          "api_base_url": os.environ.get("WORKFLOWS_LOCAL_OIDC_ISSUER_URL", "") + "/protocol/openid-connect",
          "client_kwargs": {"scope": "openid email profile roles"},
        },
      }
    ]

scheduler:
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

triggerer:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

redis:
  enabled: false

statsd:
  enabled: false

postgresql:
  enabled: true
  primary:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
