mode: deployment

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
    basicauth/stackit:
      client_auth:
        username: ${env:username}
        password: ${env:password}

  exporters:
    prometheusremotewrite:
      endpoint: ${env:METRICS_PUSH_URL}
      auth:
        authenticator: basicauth/stackit
      tls:
        insecure: false
    loki:
      endpoint: ${env:LOGS_PUSH_URL}
      auth:
        authenticator: basicauth/stackit
      tls:
        insecure: false
    otlp/stackit:
      endpoint: ${env:TRACES_PUSH_URL}
      auth:
        authenticator: basicauth/stackit
      tls:
        insecure: false

  connectors:
    spanmetrics:
      histogram:
        explicit:
          buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms]
      dimensions:
        - name: http.method
          default: GET
        - name: http.status_code

  service:
    extensions:
      - health_check
      - basicauth/stackit
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/stackit, spanmetrics]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki]

extraEnvFrom:
  - secretRef:
      name: blueprint-observability-auth

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

livenessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 15
