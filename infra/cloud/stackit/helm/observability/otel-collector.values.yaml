mode: deployment

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    faro:
      endpoint: 0.0.0.0:12347
      cors:
        allowed_origins:
          - "*"

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    filter/drop-healthcheck-spans:
      error_mode: ignore
      traces:
        span:
          - attributes["http.route"] == "/healthz"
          - attributes["http.target"] == "/healthz"
    batch: {}

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
    basicauth/stackit:
      client_auth:
        username: ${file:/etc/otel/secrets/username}
        password: ${file:/etc/otel/secrets/password}

  exporters:
    prometheusremotewrite:
      endpoint: ${file:/etc/otel/secrets/METRICS_PUSH_URL}
      auth:
        authenticator: basicauth/stackit
      tls:
        insecure: false
    loki:
      endpoint: ${file:/etc/otel/secrets/LOGS_PUSH_URL}
      auth:
        authenticator: basicauth/stackit
      tls:
        insecure: false
    otlp/stackit:
      endpoint: ${file:/etc/otel/secrets/TRACES_PUSH_URL}
      auth:
        authenticator: basicauth/stackit
      tls:
        insecure: false

  connectors:
    spanmetrics:
      histogram:
        explicit:
          buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms]
      dimensions:
        - name: http.method
          default: GET
        - name: http.status_code

  service:
    extensions:
      - health_check
      - basicauth/stackit
    pipelines:
      traces:
        receivers: [otlp, faro]
        processors: [memory_limiter, filter/drop-healthcheck-spans, batch]
        exporters: [otlp/stackit, spanmetrics]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp, faro]
        processors: [memory_limiter, batch]
        exporters: [loki]

extraVolumes:
  - name: obs-auth
    secret:
      secretName: blueprint-observability-auth
extraVolumeMounts:
  - name: obs-auth
    mountPath: /etc/otel/secrets
    readOnly: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  faro:
    enabled: true
    containerPort: 12347
    servicePort: 12347
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

livenessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 15
